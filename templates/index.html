<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support CRM | Datastraw</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">

    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-headset text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none">Datastraw Support CRM</h1>
                    <span class="text-xs text-slate-400">Enterprise Ticket Management</span>
                </div>
            </div>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium text-sm transition flex items-center space-x-2">
                <i class="fa-solid fa-plus"></i>
                <span>Create Ticket</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- metrics summary -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-4">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Tickets</span>
                <div class="text-2xl font-bold mt-1" id="totalCount">0</div>
            </div>
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-4">
                <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Open</span>
                <div class="text-2xl font-bold mt-1 text-emerald-400" id="openCount">0</div>
            </div>
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-4">
                <span class="text-xs font-semibold text-amber-400 uppercase tracking-wider">In Progress</span>
                <div class="text-2xl font-bold mt-1 text-amber-400" id="progressCount">0</div>
            </div>
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-4">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Closed</span>
                <div class="text-2xl font-bold mt-1 text-slate-400" id="closedCount">0</div>
            </div>
        </div>

        <!-- controls -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
            <div class="flex bg-slate-800/80 p-1 rounded-xl border border-slate-700/50 w-full md:w-auto">
                <button onclick="setFilter('All')" id="tab-All" class="px-4 py-1.5 text-xs font-medium rounded-lg text-slate-300 hover:text-white transition">All</button>
                <button onclick="setFilter('Open')" id="tab-Open" class="px-4 py-1.5 text-xs font-medium rounded-lg text-slate-300 hover:text-white transition">Open</button>
                <button onclick="setFilter('In Progress')" id="tab-InProgress" class="px-4 py-1.5 text-xs font-medium rounded-lg text-slate-300 hover:text-white transition">In Progress</button>
                <button onclick="setFilter('Closed')" id="tab-Closed" class="px-4 py-1.5 text-xs font-medium rounded-lg text-slate-300 hover:text-white transition">Closed</button>
            </div>
            <div class="relative w-full md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" oninput="onSearchInput()" placeholder="Search name, email, subject, ID..." class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-500 transition">
            </div>
        </div>

        <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-800 text-xs uppercase font-semibold text-slate-400 border-b border-slate-700/50">
                        <tr>
                            <th class="px-6 py-4">Ticket ID</th>
                            <th class="px-6 py-4">Customer</th>
                            <th class="px-6 py-4">Subject</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4">Created Date</th>
                            <th class="px-6 py-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="ticketTableBody" class="divide-y divide-slate-700/50">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- new ticket modal -->
    <div id="ticketModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-white">Create Support Ticket</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="createTicketForm" onsubmit="handleCreateTicket(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Customer Name</label>
                    <input type="text" id="custName" required placeholder="John Doe" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Customer Email</label>
                    <input type="email" id="custEmail" required placeholder="john@example.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Subject</label>
                    <input type="text" id="custSubject" required placeholder="Unable to reset password" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Issue Description</label>
                    <textarea id="custDesc" rows="4" required placeholder="Detailed description of the customer's problem..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-700/50">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm text-slate-400 hover:text-white">Cancel</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-lg font-medium text-sm">Submit Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currSt = 'All';
        let timer = null;

        async function fetchTickets() {
            const srch = document.getElementById('searchInput').value;
            let url = `/api/tickets?status=${currSt}`;
            if (srch) url += `&search=${encodeURIComponent(srch)}`;

            const res = await fetch(url);
            const list = await res.json();
            renderTable(list);
            updateMetrics(list);
        }

        function renderTable(list) {
            const tbody = document.getElementById('ticketTableBody');
            if (!list.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-slate-500">No tickets found</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(t => {
                // status color tags
                let badge = 'bg-slate-700/50 text-slate-300 border-slate-600';
                if (t.status === 'Open') badge = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                if (t.status === 'In Progress') badge = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                if (t.status === 'Closed') badge = 'bg-slate-500/10 text-slate-400 border-slate-500/20';

                const dateStr = new Date(t.created_at).toLocaleDateString();
                // vip indicator
                const vipTag = t.is_vip ? `<span class="ml-1 text-[10px] bg-purple-500/20 text-purple-300 border border-purple-500/30 px-1.5 py-0.5 rounded">VIP</span>` : '';

                return `
                    <tr class="hover:bg-slate-800/30 transition">
                        <td class="px-6 py-4 font-semibold text-indigo-400">${t.ticket_id}${vipTag}</td>
                        <td class="px-6 py-4">
                            <div class="font-medium text-slate-200">${t.customer_name}</div>
                            <div class="text-xs text-slate-400">${t.customer_email}</div>
                        </td>
                        <td class="px-6 py-4 font-medium text-slate-200">${t.subject}</td>
                        <td class="px-6 py-4">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${badge}">
                                ${t.status}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-xs text-slate-400">${dateStr}</td>
                        <td class="px-6 py-4 text-right">
                            <a href="/ticket/${t.ticket_id}" class="text-xs font-semibold text-indigo-400 hover:text-indigo-300">View Details &rarr;</a>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateMetrics(list) {
            document.getElementById('totalCount').innerText = list.length;
            document.getElementById('openCount').innerText = list.filter(t => t.status === 'Open').length;
            document.getElementById('progressCount').innerText = list.filter(t => t.status === 'In Progress').length;
            document.getElementById('closedCount').innerText = list.filter(t => t.status === 'Closed').length;
        }

        function setFilter(status) {
            currSt = status;
            ['All', 'Open', 'InProgress', 'Closed'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if ((status === 'In Progress' && t === 'InProgress') || status === t) {
                    btn.className = 'px-4 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow';
                } else {
                    btn.className = 'px-4 py-1.5 text-xs font-medium rounded-lg text-slate-300 hover:text-white transition';
                }
            });
            fetchTickets();
        }

        function onSearchInput() {
            // debounce search requests
            clearTimeout(timer);
            timer = setTimeout(fetchTickets, 250);
        }

        function openModal() { document.getElementById('ticketModal').classList.remove('hidden'); document.getElementById('ticketModal').classList.add('flex'); }
        function closeModal() { document.getElementById('ticketModal').classList.add('hidden'); document.getElementById('ticketModal').classList.remove('flex'); }

        async function handleCreateTicket(e) {
            e.preventDefault();
            const body = {
                customer_name: document.getElementById('custName').value,
                customer_email: document.getElementById('custEmail').value,
                subject: document.getElementById('custSubject').value,
                description: document.getElementById('custDesc').value
            };

            await fetch('/api/tickets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            closeModal();
            document.getElementById('createTicketForm').reset();
            fetchTickets();
        }

        setFilter('All');
    </script>
</body>
</html>
